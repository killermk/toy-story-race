<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Story Race</title>
<style>
  :root { --bg: #fdf6e3; --fg: #1d2a4d; --accent: #e63946; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14182b; --fg: #f1f1f1; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0; }
  span { color: var(--accent); }
  p { opacity: .7; }
</style>
</head>
<body>
  <main>
    <h1>Toy Story <span>Race</span></h1>
    <p>Página de teste: o link está funcionando.</p>
  </main>
</body>
</html>
